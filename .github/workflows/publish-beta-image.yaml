name: Publish beta image to GHCR

on:
  release:
    types: [prereleased]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish_beta_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch beta image
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -t "${IMAGE_NAME}:beta" --push .